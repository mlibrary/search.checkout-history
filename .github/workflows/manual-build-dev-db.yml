name: Manual Build Development DB

on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag
        required: true

jobs:
  build-unstable:
    uses: mlibrary/platform-engineering-workflows/.github/workflows/build-unstable.yml@v1
    with:
      image_name: ${{ vars.DEV_DB_IMAGE_NAME }}
      tag: ${{ github.event.inputs.tag }}
      context: "lib/dev_db/."
      dockerfile: Dockerfile
    secrets: inherit
